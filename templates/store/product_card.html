<article class="product-card"><a href="{% url 'product_detail' p.slug %}" class="product-image"><img src="{% if p.image %}{{p.image.url}}{% else %}{{p.image_url}}{% endif %}" alt="{{p.name}}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/700x900/f3edf0/57434d?text=My+Myntra';">{% if p.discount_percent %}<span class="discount-tag">{{p.discount_percent}}% OFF</span>{% endif %}</a><div class="product-info"><small>{{p.brand.name|default:'MY MYNTRA'}}</small><a href="{% url 'product_detail' p.slug %}" class="product-name">{{p.name}}</a><div><b>₹{{p.selling_price}}</b> <del>₹{{p.price}}</del></div><small>★ {{p.rating}} · {{p.stock}} left</small></div></article>
