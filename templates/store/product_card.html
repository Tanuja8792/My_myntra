<article class="product-card"><a href="{% url 'product_detail' p.slug %}" class="product-image">{% if p.image %}<img src="{{p.image.url}}" alt="{{p.name}}">{% elif p.image_url %}<img src="{{p.image_url}}" alt="{{p.name}}" loading="lazy">{% else %}<div class="image-placeholder">{{p.category.name}}</div>{% endif %}{% if p.discount_percent %}<span class="discount-tag">{{p.discount_percent}}% OFF</span>{% endif %}</a><div class="product-info"><small>{{p.brand.name|default:'MY MYNTRA'}}</small><a href="{% url 'product_detail' p.slug %}" class="product-name">{{p.name}}</a><div><b>₹{{p.selling_price}}</b> <del>₹{{p.price}}</del></div><small>★ {{p.rating}} · {{p.stock}} left</small></div></article>
